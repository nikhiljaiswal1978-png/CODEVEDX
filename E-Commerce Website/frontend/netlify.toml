[build]
  command = "npm run build"
  publish = "dist"

# Replace YOUR-API-URL with your deployed backend (e.g. Render) URL before deploying.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API-URL.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
